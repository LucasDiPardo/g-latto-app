<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>G-LATTO - Dado del Trago</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-touch.png">
<meta name="theme-color" content="#150429">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="G-Latto">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dado.css">
</head>
<body>

<div class="bg-fixed"></div>

<div class="back-bar">
  <a class="back-link" href="index.html">&larr; Menu</a>
  <img class="mini-logo" src="assets/glatto-logo.png" alt="G-Latto">
</div>

<div class="wrap">

  <div class="dice-area">
    <canvas id="diceCanvas" width="220" height="220"></canvas>
    <button class="btn btn-gold roll-btn" id="rollBtn">Tirar dado</button>
    <div class="dice-rule" id="diceRule">Toca "Tirar dado" para empezar</div>
  </div>

  <div class="options-area">
    <div class="options-header">
      <span>Reglas del dado</span>
      <button class="btn-small" id="toggleListBtn">Ver / editar &#9662;</button>
    </div>

    <div class="options-body hidden" id="optionsBody">
      <ul class="options-list" id="rulesList"></ul>
    </div>
  </div>

</div>

<div class="result-overlay" id="editOverlay">
  <div class="result-card edit-card">
    <div class="result-label" id="editTitle">Editar regla</div>
    <input type="text" id="editRuleText" class="edit-input" maxlength="60" placeholder="Regla para este numero...">
    <div class="edit-actions">
      <button class="btn btn-secondary" id="cancelEditBtn">Cancelar</button>
      <button class="btn btn-gold" id="saveEditBtn">Guardar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/common.js"></script>
<script src="js/dado.js"></script>
</body>
</html>
